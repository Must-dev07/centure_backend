# TLS termination point: in production, terminate HTTPS HERE (or at a load
# balancer in front). Django sets SECURE_PROXY_SSL_HEADER and trusts
# X-Forwarded-Proto from this proxy. See docs/deployment-guide.md.
upstream django {
    server web:8000;
}

server {
    listen 80;
    client_max_body_size 5m;

    location /static/ {
        alias /staticfiles/;
        access_log off;
        expires 7d;
    }

    location / {
        proxy_pass http://django;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
